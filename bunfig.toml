[install]
# A version published in the last seven days is not installed: a hijacked package is usually
# found and pulled within that time. Dependabot waits as long (.github/dependabot.yml).
minimumReleaseAge = 604800
# Each package sees the dependencies it declares, and a peer resolves to its dependent's: the docs
# get VitePress's Vite, and apps/pub gets Vite+'s.
linker = "isolated"

[test]
root = "./tests"
# Async tests in a file overlap while awaiting I/O. Sync tests and test.serial stay sequential.
concurrentTestGlob = "**/*.test.ts"
preload = ["./tests/setup.ts"]
