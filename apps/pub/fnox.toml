# dek.pub's production secrets, encrypted with age to the keys below (ADR 86). Local runs and CI
# take dev.env and the e2e server's own values, so the default profile holds nothing.
#
#   fnox -P prod set NAME --provider age   store or change a value
#   fnox -P prod check                     every value is here and decrypts
#   bun run secrets                        put them on both Workers
#
# A reader's age public key goes in recipients, followed by `fnox reencrypt`; the private key
# stays outside the repository, in ~/.config/fnox/age.txt or FNOX_AGE_KEY.

[providers.age]
type = "age"
recipients = [
  "age12x87xquknk7r44ywpg53czvj756nm5hewsvg7w5h9ptwpzcjfcjq4x97k5",
  "age1eevshj2ttkzvgp4vf277aqgqfw227zf7sh88vz0r8n2e5ymjmpnqp92gtm",
]

[profiles.prod.targets.serve]
type = "cloudflare-workers"
worker = "dek-pub-serve"

[profiles.prod.secrets]
SERVE_TOKEN_SECRET= { provider = "age", value = "fnox-age-batch-v1::RZpqmefX3K3+YFRmiWETXQGHhCLEai895SVbf9Qt8BeglLGmotO8EtI1TCCULmNcTBfX6ypYY3v8sPfP/gnxgvHUwSVeQOUuUcNFh1WH4HBzyEorl6Xx8X9OZfI=", description = "Signs deck tokens; both Workers hold the same value", if_missing = "error", push = ["serve"] }
AUTH_GITHUB_CLIENT_ID= { provider = "age", value = "fnox-age-batch-v1::0o2I1fK9fEMZIye5beiur/ZCd6ER7wyU6BO6JkZ5AEULxDjiv0d/VyNw6ApoRMRU", description = "dek.pub's GitHub OAuth app, at github.com/settings/developers", if_missing = "error" }
AUTH_GITHUB_CLIENT_SECRET= { provider = "age", value = "fnox-age-batch-v1::WltjdeSe/xhFKyvK9r/FZJGFgPZ2w1Xo4FqYvVMN2QOSav2yDz2JBcNltMmjdJRoKGjstF3V4twTD7yy/MdYCWdiGYY=", description = "dek.pub's GitHub OAuth app, at github.com/settings/developers", if_missing = "error" }
DEK_PUB_OPERATORS= { provider = "age", value = "fnox-age-batch-v1::k7qqdkk4U/aF2M9Nt1EeQmFmB9kSy32uIZ6xgpQLw7hlQJG5xLYj1RTHXg==", description = "Email addresses of those who run dek.pub (ADR 82, 85)", if_missing = "error" }
