# AI が書きがちで、発表では伝わりにくい言い回しの一覧。dek-words が台本とスライドを検査する。
# 語と言い換えの多くは nanaism/yomiyasu の references/（slop-catalog.md、calques.md、lists/）から、
# 話す原稿とスライドで、ほぼいつも直したほうがよいものに絞って取った。
# yomiyasu: https://github.com/nanaism/yomiyasu  MIT License, Copyright (c) 2026 nanaism（全文は隣の YOMIYASU-LICENSE）
# デッキに要る語は、そのデッキの words.yaml の allow で許す。
version: 1
words:
  # 比喩の動詞（slop-catalog.md 1章、10章）
  - word: 溶かす
    verb: godan
    use: 「時間がかかった」「時間を費やした」と、何にどれだけかかったかを書く
  - word: 〜側に倒す
    pattern: '側に倒[さしすせそ]'
    use: 「〜を優先する」「〜の扱いに統一する」と、どちらを選ぶかを書く
  - word: 一つずつ潰す
    pattern: 'ずつ潰[さしすせそ]'
    use: 「1つずつ直す」と、何をどうするかを書く
  - word: 収斂
    use: 「落ち着いた」「決まった」と書く
  - word: 黙って無視される
    pattern: '黙って(無視|捨て|消え|失敗|落ち|壊れ|握りつぶ|飲み込|書き換)'
    use: 「気づかないうちに無視される」と書く。エラーが出ないと分かるときだけ「エラーを出さずに」
  - word: 静かに壊れる
    pattern: '静かに(壊れ|失敗|落ち|消え|止ま|死[なにぬねのん])'
    use: 「気づかないうちにおかしくなる」と、何がどうなるかを書く
  - word: 効いてくる
    pattern: '効いて[きくこ]'
    use: 何がどう変わるかを書く（「〜が少しずつ楽になる」など）
  - word: 地味に効く
    pattern: '地味に効[かきくけこい]'
    use: 「目立たないが役に立つ」と、何の役に立つかを書く
  - word: そこで効くのは
    pattern: '[こそ]こで効く(の|も)'
    use: 「そこで大事なのは」と書くか、その工夫で何がどう変わるかを書く
  - word: 前提が崩れる
    pattern: '(前提|基盤)が崩れ'
    use: 前提にしていた条件や数値を主語にして、何が当てはまらなくなったかを書く

  # 直訳調（slop-catalog.md 2章、calques.md 1章）
  - word: 〜した瞬間
    pattern: 'た瞬間'
    use: 「〜するとすぐに」「〜した時点で」と書く
  - word: 正本
    use: 「元にするファイル」「比べる基準」と、その役割を書く
  - word: 深く分け入る
    pattern: '深く分け入'
    use: 「詳しく調べる」「具体的に見ていく」と書く
  - word: この版
    pattern: '(この|新しい|今回の|前の|古い|手元の|最新の|次の)版(で|に|は|を|が|から|の|へ)'
    use: ソフトウェアなら「バージョン」と書く
  - word: 回帰が出る
    pattern: '回帰(が出|を起こ|が起き|が起こ|を生)'
    use: 「前は動いていた〜が動かなくなった」と書く
  - word: 足すものがない
    pattern: '足すものが(な|あり)'
    use: 「得られる利点がない」と、何が得られないかを書く
  - word: テーブルの上にある
    pattern: 'テーブルの上に(あ|載|乗)'
    use: 案や選択肢なら、まだ決まっていないことと、誰がいつ決めるかを書く
  - word: プロジェクトレベル
    pattern: '(リポジトリ|プロジェクト|ワークスペース|組織|ファイル)レベルの'
    use: どのフォルダに置き、どの範囲に当てるものかを書く
  - word: 背景実行
    use: 「バックグラウンド実行」と書く
  - word: 根因
    use: 「根本原因」か「原因」と書く
  - word: 時間窓
    use: 「時間帯」「〜分のあいだ」と書く
  - word: 受け口
    use: 実物の名前（エンドポイント、URL、窓口など）を書く
  - word: ダッシュ
    pattern: '[—―─━]'
    in: script
    use: 読み上げると間しか残らない。読点や助詞でつなぐか、文を分ける

  # 急に増えた語（slop-catalog.md 3章）
  - word: 勝ち筋
    use: 「うまくいく見込みのある進め方」と、何をするかを書く
  - word: 〜への近道
    pattern: 'への近道'
    use: 「〜を早く進める方法」と、そのやり方を書く
  - word: 〜のカギ
    pattern: 'のカギ'
    use: 「〜を左右する点」と、何が何を左右するかを書く
  - word: 両輪
    except:
      - 車の両輪
    use: 「どちらも欠かせない二つ」と、二つの名前を書く

  # 大げさな熟語（slop-catalog.md 4章）
  - word: 深淵
    use: 「奥が深い」「分かりにくい」と、ふだんの言葉で書く
  - word: 極致
    use: 何がどれだけ良いかを書く
  - word: 真理
    except:
      - 真理値
      - 真理表
    use: 「本当のところ」と書くか、分かったことをそのまま書く

  # 具体的に見えて意味があいまいな言葉（slop-catalog.md 5章）
  - word: 解像度を上げる
    pattern: '解像度(を上げ|を高め|が上が|が高ま)'
    use: 何がどこまで分かったかを書く
  - word: 腹落ち
    use: 「納得する」「分かる」と書く
  - word: 肌感
    use: 何を見てそう感じたかを書く
  - word: 血の通った
    use: 何が具体的にどうなっているかを書く
  - word: 地に足のついた
    pattern: '地に足[のが]つ(い|け)'
    use: 何が現実的なのかを書く
  - word: 思考のOS
    pattern: '(思考|意思決定|判断|仕事|組織)の?OS(?![a-z\d])'
    use: 何をする仕組みかを、ふだんの言葉で書く
  - word: 紐解く
    pattern: '(?<!歴史を)紐解[かきくけこい]'
    use: 「原因を調べる」「順に説明する」と、何をするかを書く

  # 前置きと決まった結び（slop-catalog.md 6章）
  - word: ここで注目すべきは
    pattern: 'ここで注目すべき'
    use: 前置きを外し、注目してほしい中身から言う
  - word: まさにそこがポイント
    pattern: 'まさに(そこ|ここ)がポイント'
    use: 前置きを外し、何が大事かをそのまま言う
  - word: 答えはシンプル
    pattern: '(原因|答え|理由|結論)はシンプル'
    use: 前置きを外し、原因や答えをそのまま言う
  - word: 本記事では
    pattern: '(本|この)記事では'
    in: script
    use: 記事の言い方が残っている。「この発表では」と言うか、外す
  - word: 一般論ではなく
    use: AI への指示の残り。話す中身だけを残す
  - word: 〜に他ならない
    pattern: 'に(他|ほか)なら(ない|ず)|に(他|ほか)なりません'
    use: 「〜です」と言い切る
  - word: 〜と言っても過言ではない
    pattern: 'と言っても過言では'
    use: 大げさな枠を外し、事実をそのまま言う
  - word: いかがでしたか
    pattern: 'いかがでした(か|でしょうか)'
    use: 言いたいことを一文で言って終える
  - word: 参考になれば幸いです
    pattern: '参考になれば幸い|お役に立てれば幸い|お役に立てたら幸い'
    use: 外して、本文の最後の一文で終える
  - word: 小さく始めましょう
    pattern: '小さく始めましょう'
    use: 最初に何をすればよいかを具体的に言う
  - word: 〜してみてはいかがでしょうか
    pattern: 'てみてはいかがでしょう'
    use: 勧めるなら「〜してみてください」と、何をするかを言う
  - word: 〇〇
    pattern: '[〇○]{2,}'
    in: slides
    use: 仮置きの文字が残っている。入れる値を書く
  - word: 【要確認】
    use: 仮置きの印が残っている。確かめた内容を書く

  # 硬い漢語と決まり文句（slop-catalog.md 7章）
  - word: 〜を実現することができます
    pattern: 'を実現することができ'
    use: 「〜できます」と書く（高速化を実現することができます → 高速化できます）
  - word: シームレス
    use: 何と何が、どうつながるかを書く
  - word: シナジー
    use: 何と何を合わせると、何がどう良くなるかを書く
  - word: 価値を最大化
    pattern: '価値(を|の)最大化'
    use: 誰にとって何が増えるかを書く

  # 名詞にして硬くした言い回し（lists/nominalization.txt）
  - word: 〜が可能です
    pattern: 'が可能(です|でした|だ|である|となり|となる|となっ|になり|になる|になっ)'
    use: 「〜できる」と書く
  - word: 〜を実施する
    pattern: 'を実施(し|す|さ)'
    use: 「〜する」と、何をするかを書く
  - word: 〜を行う
    pattern: 'を行(う|い|っ|わ|え)'
    use: 「〜する」と、何をするかを書く
  - word: 〜を担保する
    pattern: 'を担保'
    use: 「〜を確かめる」「〜を守る」と、何をするかを書く
  - word: 〜を図る
    pattern: 'を図(る|り|っ|ら|れ)'
    use: 「〜する」「〜しようとする」と書く
  - word: 〜に資する
    pattern: 'に資(する|し|さ)'
    use: 「〜の役に立つ」と書く
  - word: 〜の観点から
    pattern: 'の観点(から|で|では)'
    use: 「〜で見ると」「〜を考えると」と書く

  # 他動詞を一語だけ名詞にした語を「の」で受ける形（lists/renyo-nouns.txt）
  - word: の確かめ
    pattern: 'の(確かめ|直し|比べ|測り|補い|決め|選び|集め|探し|整え|揃え|そろえ|重ね|外し|戻し|削り|消し|残し|伝え|並べ|分け|減らし|増やし|広げ|縮め|続け|動かし|移し|数え|改め)(?![るたてなまよらりれろ方手])'
    use: 「結果を確かめる」と目的語と動詞に戻すか、「結果の確認」と定着した名詞にする

  # 何を指すかが伝わりにくいカタカナ語（lists/katakana-terms.txt から、発表で言い換えやすいもの）
  - word: ソリューション
    use: 何を解決する、どんな仕組みかを書く
  - word: エンゲージメント
    use: 誰の、何の行動が増えるのかを書く
  - word: ケイパビリティ
    use: 何ができるのかを書く
  - word: レバレッジ
    use: 何を使って、何をどれだけ増やすのかを書く
  - word: オポチュニティ
    use: 「機会」と書くか、何ができる見込みかを書く
  - word: イニシアチブ
    use: 誰が始める、どんな取り組みかを書く
  - word: アライメント
    use: 誰と誰が、何について合意するのかを書く
  - word: インサイト
    use: 何が分かったのかを書く
  - word: ベストプラクティス
    use: そのやり方そのものを書く
  - word: トランスフォーメーション
    use: 何が、何から何に変わるのかを書く
  - word: モメンタム
    use: 何が、どれだけ伸びているのかを書く
  - word: コアコンピタンス
    use: ほかにない強みを、そのまま書く
  - word: パーパス
    use: 「目的」と書くか、何のためかを書く

  # 絵文字（doc-types/slides.md 2章）
  - word: 絵文字
    pattern: '\p{Emoji_Presentation}'
    use: 絵文字を外す。印が要るなら、テーマの記号や CSS で描く
