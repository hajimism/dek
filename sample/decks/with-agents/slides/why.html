<section class="slide" data-layout="default">
  <p class="kicker"><span class="badge">02</span>Problem</p>
  <h2 class="slide-title">エージェントがスライドでつまずく、三つの理由</h2>
  <div class="stage cards">
    <article class="card problem" data-step="why-blind" data-morph="promise-1">
      <div class="mock" aria-hidden="true">
        <div class="frame">
          <span class="bar bar-title"></span>
          <span class="bar"></span>
          <span class="bar bar-long"></span>
          <span class="bar"></span>
        </div>
      </div>
      <p class="pill pill-err">blind</p>
      <h3 class="card-title">画面が見えない</h3>
      <p class="note">HTML は正しくても、描画すると文字が枠からはみ出す。書いた本人には、それが見えない。</p>
    </article>
    <article class="card problem" data-step="why-big" data-morph="promise-2">
      <div class="mock" aria-hidden="true">
        <div class="minimap">
          <span class="focus"></span>
        </div>
        <div class="track"><span class="thumb"></span></div>
      </div>
      <p class="pill pill-err">huge file</p>
      <h3 class="card-title">ファイルが大きすぎる</h3>
      <p class="note">資料全体がひとつのファイル。一枚を直すのに全体を読み、関係ないところまで壊す。</p>
    </article>
    <article class="card problem" data-step="why-done" data-morph="promise-3">
      <div class="mock mock-done" aria-hidden="true">
        <p class="bubble bubble-human ask">いい感じにして</p>
        <p class="bubble bubble-agent unsure">これで完成…？</p>
      </div>
      <p class="pill pill-err">no finish line</p>
      <h3 class="card-title">終わりがわからない</h3>
      <p class="note">どこまでやれば完成か、決まっていない。エージェントには止めどきがない。</p>
    </article>
  </div>
  <p class="meta"><span>スライドを、エージェントに任せる</span><span>02 / 12</span></p>
</section>
