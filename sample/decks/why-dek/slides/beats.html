<section class="slide" data-layout="page" data-folio="08">
  <p class="numeral">08</p>
  <h2 class="slide-title">いつ出すかは台本、どう出すかはテーマ</h2>
  <p class="lede">段階的に見せる仕組みも、役割を分けています。スライドの HTML は、要素がどのビートで出るかを <span class="chip">data-step</span> で書くだけです。</p>
  <div class="stage">
    <figure class="part">
      <p class="label">script.md　いつ</p>
      <pre class="code"><span class="tok-h">### いつは、台本のビート {#beats-when}</span>
いつ出すかは、喋りの都合です。…

<span class="tok-h">### どうは、テーマの CSS {#beats-how}</span>
どう出すかは、見せ方の都合です。…</pre>
    </figure>
    <figure class="part">
      <p class="label">slides/beats.html　結ぶ</p>
      <pre class="code">&lt;span class="bracket is-when"
  <span class="tok-s">data-step="beats-when"</span>&gt;
  &lt;strong&gt;いつ：台本が決める&lt;/strong&gt;…
&lt;/span&gt;

&lt;span class="bracket is-how"
  <span class="tok-s">data-step="beats-how"</span>&gt;
  &lt;strong&gt;どう：テーマが決める&lt;/strong&gt;…
&lt;/span&gt;</pre>
    </figure>
    <figure class="part">
      <p class="label">theme.css　どう</p>
      <pre class="code">.slide.is-current [data-step] {
  opacity: 0;
  transform: translateY(var(--rise));
  transition: … var(--step-transition);
}
.slide.is-current [data-step]<span class="tok-s">.is-shown</span> {
  opacity: 1;
  transform: none;
}</pre>
    </figure>
    <span class="bracket is-when" data-step="beats-when"><strong>いつ：台本が決める</strong>ビートの id で結ぶ。喋りの都合で順番を変えても、HTML はそのまま。</span>
    <span class="bracket is-how" data-step="beats-how"><strong>どう：テーマが決める</strong>ランタイムは <span class="chip">is-shown</span> を付けるだけ。アニメーションの独自記法はない。</span>
  </div>
  <p class="source">三つの抜粋は、このスライドとこの資料の theme.css の実物。</p>
</section>
