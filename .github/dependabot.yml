version: 2
updates:
  # One weekly PR per ecosystem, so updates arrive as a batch CI checks together. Not /sample:
  # it installs this repository through `file:..`, and Dependabot hangs copying it.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      dependencies:
        patterns: ["*"]
  # Actions are pinned to commit SHAs; this keeps the SHAs and their version comments current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
