name: Nightly

on:
  schedule:
    - cron: "23 18 * * *"
  workflow_dispatch:
    inputs:
      seed:
        description: The seed a random-order run printed, to run the tests in that order again. Empty for a new order.
        required: false
        default: ""

# One run at a time: a run started by hand waits for the night's, and does not stop it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The suite in an order of its own each night, so a test that passes only after another one
  # has run shows up. The seed is chosen before the tests start and printed first, so a run that
  # hangs or crashes still says it; a failed run is the alarm.
  random-order:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        bun: [1.4.0, latest]
    name: random order (bun ${{ matrix.bun }})
    env:
      # Each of these is one scenario: its tests drive one mounted player in the order they are
      # written, so shuffled they fail by design. They run after the shuffled run, in that order.
      # A file made order-independent comes off this list.
      IN_ORDER: >-
        tests/runtime/annotate-player.test.ts
        tests/runtime/browser.test.ts
        tests/runtime/laser-player.test.ts
        tests/runtime/marks-player.test.ts
        tests/runtime/remote.test.ts
        tests/runtime/slide-motion.test.ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ matrix.bun }}
      - run: bun install --frozen-lockfile
      # As in CI: Chromium without --with-deps, whose apt can stall, from a cache.
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(bun -p 'require("playwright/package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        run: bunx playwright install chromium
      # The line-break tests measure Japanese, so they need CJK fonts, cached as in CI.
      - id: cjk-fonts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/cjk-fonts
          key: cjk-fonts-${{ runner.os }}-ipafont-gothic-wqy-zenhei
      - name: Download the CJK fonts
        if: steps.cjk-fonts.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -q
          mkdir -p ~/cjk-fonts
          cd ~/cjk-fonts && apt-get download fonts-ipafont-gothic fonts-wqy-zenhei
      - name: Install the CJK fonts
        run: sudo dpkg -i ~/cjk-fonts/*.deb
      - name: Install rumdl
        env:
          RUMDL_VERSION: 0.2.73
          RUMDL_SHA256: d56a8e40471af32fe3229e845f3e299e3691665b15cd4ca28f2deb502c487666
        run: |
          curl -fsSL -o rumdl.tar.gz "https://github.com/rvben/rumdl/releases/download/v$RUMDL_VERSION/rumdl-v$RUMDL_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          echo "$RUMDL_SHA256  rumdl.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf rumdl.tar.gz -C "$HOME/.local/bin"
          rm rumdl.tar.gz
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/rumdl" --version
      - name: Choose the seed
        id: seed
        env:
          SEED: ${{ inputs.seed }}
        run: |
          if [ -z "$SEED" ]; then
            SEED="$(od -An -N4 -tu4 /dev/urandom | tr -d ' ')"
          fi
          # The whole value, newlines included, so nothing past a digit reaches GITHUB_OUTPUT.
          if [[ ! "$SEED" =~ ^[0-9]{1,10}$ ]] || [ "$SEED" -gt 4294967295 ]; then
            echo "::error::A seed is a whole number from 0 to 4294967295, as a run's summary gives it."
            exit 1
          fi
          echo "seed=$SEED" >> "$GITHUB_OUTPUT"
          echo "Seed: $SEED"
          command="bun test --randomize --seed=$SEED"
          read -ra files <<< "$IN_ORDER"
          for file in "${files[@]}"; do
            command+=" --path-ignore-patterns=$file"
          done
          {
            # The version itself, not the matrix's "latest", so a replay can take the same Bun.
            echo "The tests ran in random order with seed $SEED on Bun $(bun --version). To run them in this order again, run this workflow with that seed, or locally on that Bun:"
            echo
            echo "    $command"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Run the tests in random order
        id: shuffled
        env:
          SEED: ${{ steps.seed.outputs.seed }}
        run: |
          read -ra files <<< "$IN_ORDER"
          ignored=()
          for file in "${files[@]}"; do
            ignored+=("--path-ignore-patterns=$file")
          done
          bun test --randomize --seed="$SEED" "${ignored[@]}"
      # After the shuffled run, whether it passed or not; not after a step before it failed.
      - name: Run the scenarios in their order
        if: ${{ !cancelled() && (steps.shuffled.outcome == 'success' || steps.shuffled.outcome == 'failure') }}
        run: |
          read -ra files <<< "$IN_ORDER"
          bun test "${files[@]}"

  # The suite on macOS. It brings Hiragino, the font the sample themes ask for, so no CJK font is
  # installed; and it is the one run where CoreImage reads back the QR codes dekc draws
  # (tests/cli/qr.test.ts), which no Linux runner can.
  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      # Playwright keeps its browsers under ~/Library/Caches on macOS, and needs no system
      # packages there, so there is nothing for --with-deps to do.
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(bun -p 'require("playwright/package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        run: bunx playwright install chromium
      - name: Install rumdl
        env:
          RUMDL_VERSION: 0.2.73
          RUMDL_SHA256: 54e0e7c3031b8bfa37e3c57104cc0c93988e02f5b7023c1804749fd180822f9e
        run: |
          curl -fsSL -o rumdl.tar.gz "https://github.com/rvben/rumdl/releases/download/v$RUMDL_VERSION/rumdl-v$RUMDL_VERSION-aarch64-apple-darwin.tar.gz"
          echo "$RUMDL_SHA256  rumdl.tar.gz" | shasum -a 256 -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf rumdl.tar.gz -C "$HOME/.local/bin"
          rm rumdl.tar.gz
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/rumdl" --version
      - run: bun test

  # How long lint, check, and build take on the sample decks: a record to compare a night
  # against when a change might slow the agent loop, kept as the bench artifact. Nothing fails on
  # a time.
  bench:
    runs-on: ubuntu-latest
    # Minutes on a laptop; a runner can be several times slower.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(bun -p 'require("playwright/package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        run: bunx playwright install chromium
      # The sample themes ask for Hiragino, which Linux lacks; Noto CJK is the closest fallback,
      # as in the Pages build.
      - id: cjk-fonts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/cjk-fonts
          key: cjk-fonts-${{ runner.os }}-noto-cjk
      - name: Download the CJK fonts
        if: steps.cjk-fonts.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -q
          mkdir -p ~/cjk-fonts
          cd ~/cjk-fonts && apt-get download fonts-noto-cjk
      - name: Install the CJK fonts
        run: sudo dpkg -i ~/cjk-fonts/*.deb
      # lint runs rumdl when it is installed, as a project's own lint does.
      - name: Install rumdl
        env:
          RUMDL_VERSION: 0.2.73
          RUMDL_SHA256: d56a8e40471af32fe3229e845f3e299e3691665b15cd4ca28f2deb502c487666
        run: |
          curl -fsSL -o rumdl.tar.gz "https://github.com/rvben/rumdl/releases/download/v$RUMDL_VERSION/rumdl-v$RUMDL_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          echo "$RUMDL_SHA256  rumdl.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf rumdl.tar.gz -C "$HOME/.local/bin"
          rm rumdl.tar.gz
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/rumdl" --version
      - run: bun scripts/bench.ts > bench.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench
          path: bench.json
          if-no-files-found: error
