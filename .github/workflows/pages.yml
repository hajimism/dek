name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # configure-pages reads the site's settings; nothing here can write to it.
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      # Lets Chromium's sandbox start on Ubuntu 24.04, whose AppArmor blocks user namespaces (ADR 27).
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: bun install --frozen-lockfile
      # `dekc build` shoots each sample's first slide for its link preview image. As in CI, it
      # skips --with-deps, whose apt can stall on a slow Ubuntu mirror, and caches the download.
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(bun -p 'require("playwright/package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        run: bunx playwright install chromium
      # The sample themes ask for Hiragino, which Linux lacks; Noto CJK is the closest fallback.
      # Its package is cached, so apt is reached only when the cache is cold.
      - id: cjk-fonts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/cjk-fonts
          key: cjk-fonts-${{ runner.os }}-noto-cjk
      - name: Download the CJK fonts
        if: steps.cjk-fonts.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -q
          mkdir -p ~/cjk-fonts
          cd ~/cjk-fonts && apt-get download fonts-noto-cjk
      - name: Install the CJK fonts
        run: sudo dpkg -i ~/cjk-fonts/*.deb
      - run: bun run docs:build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/.vitepress/dist

  # Only this job can write to Pages; the build, which installs and runs the dependencies,
  # cannot.
  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
