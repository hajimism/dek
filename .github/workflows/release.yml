name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Keeps a release PR open from the Conventional Commits on main. Merging it tags the commit,
  # writes CHANGELOG.md and the GitHub Release, and hands over to `publish`.
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Publishes with npm's trusted publishing: no token, and provenance is attached. `bun publish`
  # cannot authenticate over OIDC, so npm does the publishing; Bun only checks the tarball first.
  publish:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Trusted publishing needs npm 11.5.1 or later; the latest Node 24 bundles it, so take
          # the latest rather than whatever older 24 the runner has cached.
          node-version: 24
          check-latest: true
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bash scripts/check-package.sh
      - run: npm publish
