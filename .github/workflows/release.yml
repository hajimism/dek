name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Keeps a release PR open from the Conventional Commits on main. Merging it tags the commit,
  # writes CHANGELOG.md and the GitHub Release, and hands over to `publish`.
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Packs and checks the tarball at the tag. Everything that installs or runs a dependency runs
  # here, in a job that cannot mint the token npm publishes with.
  pack:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bash scripts/check-package.sh package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: package/*.tgz
          if-no-files-found: error

  # Publishes the checked tarball with npm's trusted publishing: no token, and provenance is
  # attached. It checks out nothing and installs nothing, so no dependency's code runs beside
  # the OIDC token. `bun publish` cannot authenticate over OIDC, so npm does the publishing.
  publish:
    needs: [release-please, pack]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Trusted publishing needs npm 11.5.1 or later; the latest Node 24 bundles it, so take
          # the latest rather than whatever older 24 the runner has cached.
          node-version: 24
          check-latest: true
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: package
      # A path without `./` is a GitHub repository to npm 11, so `package/<file>.tgz`
      # became `github:package/<file>` and the publish stopped at an SSH login.
      - run: npm publish ./package/*.tgz --ignore-scripts
