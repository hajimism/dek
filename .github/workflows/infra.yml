name: Infra

# dek.pub's zones, zone settings and DNS records, declared in apps/pub/infra/alchemy.run.ts and
# applied with Alchemy (ADR 70). The Workers are deployed apart, by `void deploy` and `wrangler
# deploy`. Every job waits until the repository variable CLOUDFLARE_ACCOUNT_ID is set, so nothing
# runs against Cloudflare before the account exists.
#
# - plan: on a pull request from this repository that touches the program, with a read-only token.
# - deploy: by hand from main, in the `cloudflare-prod` environment, which asks for an approval.
# - drift: once a week; exit 2 means something was changed outside the program.

on:
  pull_request:
    paths:
      - apps/pub/infra/**
      - bun.lock
      - .github/workflows/infra.yml
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CI: "true"
  DO_NOT_TRACK: "1"
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  plan:
    # A fork's pull request gets no secrets, so it gets no plan.
    if: >-
      github.event_name == 'pull_request' && vars.CLOUDFLARE_ACCOUNT_ID != '' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/pub/infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun run plan --stage prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PLAN_TOKEN }}

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: cloudflare-prod
    defaults:
      run:
        working-directory: apps/pub/infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun run deploy --stage prod --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}

  drift:
    if: github.event_name == 'schedule' && vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/pub/infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun run drift --stage prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PLAN_TOKEN }}
