name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The pinned version is what the lockfile and releases are checked with; latest catches
    # drift in Bun itself (its TOML parser, for one) before a user on a newer Bun does.
    strategy:
      fail-fast: false
      matrix:
        bun: [1.4.0, latest]
    name: check (bun ${{ matrix.bun }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ matrix.bun }}
      - run: bun install --frozen-lockfile
      # The visual checks, shots, and video capture are tested in a real Chromium. The runner
      # already has the libraries it needs, so it skips --with-deps: that goes through apt, and
      # an Ubuntu mirror slowing to a crawl has held this step up for over ten minutes.
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(bun -p 'require("playwright/package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        run: bunx playwright install chromium
      - name: Install rumdl
        env:
          RUMDL_VERSION: 0.2.73
          RUMDL_SHA256: d56a8e40471af32fe3229e845f3e299e3691665b15cd4ca28f2deb502c487666
        run: |
          curl -fsSL -o rumdl.tar.gz "https://github.com/rvben/rumdl/releases/download/v$RUMDL_VERSION/rumdl-v$RUMDL_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          echo "$RUMDL_SHA256  rumdl.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf rumdl.tar.gz -C "$HOME/.local/bin"
          rm rumdl.tar.gz
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/rumdl" --version
      - run: bunx biome ci .
      - run: bun run typecheck
      # Exports, files, and dependencies nothing uses.
      - run: bun run knip
      - run: bun test --coverage
      - run: bun run docs:build

  # The tarball npm would ship, installed and run the way the docs say.
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bash scripts/check-package.sh

  # The decision records, checked by the adrs that mise.toml pins.
  adr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install adrs
        env:
          ADRS_VERSION: 0.12.1
          ADRS_SHA256: 1e0dda183f38eeff44a6dd82d688df4a0f3a655396fcc72cdbc31de753d88419
        run: |
          curl -fsSL -o adrs.tar.xz "https://github.com/joshrotenberg/adrs/releases/download/v$ADRS_VERSION/adrs-x86_64-unknown-linux-gnu.tar.xz"
          echo "$ADRS_SHA256  adrs.tar.xz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xJf adrs.tar.xz -C "$HOME/.local/bin" --strip-components=1 adrs-x86_64-unknown-linux-gnu/adrs
          rm adrs.tar.xz
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: adrs doctor
      # doctor does not see a Nygard section left as the template's question.
      - name: No template text left in a record
        run: |
          if grep -nE "What is the issue that we're seeing|What is the change that we're proposing|What becomes easier or more difficult" adr/*.md; then
            echo "::error::Fill every section of the ADRs above."
            exit 1
          fi
