name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # The visual checks, shots, and video capture are tested in a real Chromium.
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Install rumdl
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://github.com/rvben/rumdl/releases/download/v0.2.73/rumdl-v0.2.73-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xzf - -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/rumdl" --version
      - run: bunx biome ci .
      - run: bun run typecheck
      - run: bun test --coverage
      - run: bun run docs:build
