name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The pinned version is what the lockfile and releases are checked with; latest catches
    # drift in Bun itself (its TOML parser, for one) before a user on a newer Bun does.
    strategy:
      fail-fast: false
      matrix:
        bun: [1.4.0, latest]
    name: check (bun ${{ matrix.bun }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ matrix.bun }}
      - run: bun install --frozen-lockfile
      # The visual checks, shots, and video capture are tested in a real Chromium.
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Install rumdl
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://github.com/rvben/rumdl/releases/download/v0.2.73/rumdl-v0.2.73-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xzf - -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/rumdl" --version
      - run: bunx biome ci .
      - run: bun run typecheck
      # Exports, files, and dependencies nothing uses.
      - run: bun run knip
      - run: bun test --coverage
      - run: bun run docs:build

  # The tarball npm would ship, installed and run the way the docs say.
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bash scripts/check-package.sh
