name: Idea or feature request
description: Something dek should do, or do differently
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you were trying to do with your talk, and where dek got in the way.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like
      description: The command, flag, diagnostic, or convention you have in mind, if any.
  - type: dropdown
    id: who
    attributes:
      label: Who runs into it
      options:
        - A person writing a talk
        - An AI agent working on a deck
        - Both
